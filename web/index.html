<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MetaCity</title>
    <meta name="description" content="A hierarchical traffic digital twin: German motorway statistics, an hourly model of Aachen, and street corridors simulated vehicle by vehicle." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='5' fill='none' stroke='%230a6b78' stroke-width='2'/%3E%3Cpath d='M5 18h16M5 13h16M5 8h16' stroke='%230a6b78' stroke-width='2' opacity='.7'/%3E%3Ccircle cx='17' cy='13' r='2.6' fill='%230a6b78'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/views.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#germany" aria-label="MetaCity, back to Germany">
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <rect x="1" y="1" width="24" height="24" rx="5" fill="none" stroke="var(--accent)" stroke-width="2" />
            <path d="M5 18h16M5 13h16M5 8h16" stroke="var(--accent)" stroke-width="2" opacity="0.7" />
            <circle cx="17" cy="13" r="2.6" fill="var(--accent)" />
          </svg>
          MetaCity
        </a>
        <nav aria-label="Zoom level" style="display: contents">
          <ol class="ladder" id="ladder"></ol>
        </nav>
        <div class="simbar" id="simbar" role="toolbar" aria-label="Simulation controls"></div>
      </div>
      <div class="statusline" id="statusline"></div>
    </header>

    <main class="page" id="view" tabindex="-1"></main>

    <footer class="footer">
      <p>
        MetaCity MVP. Every vehicle, count and sensor here is simulated; motorway volumes are illustrative, the Aachen
        network is schematic and its sensor masts are fictional. German states from deutschlandGeoJSON (Unlicense).
      </p>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
